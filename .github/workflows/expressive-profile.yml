name: Expressive Profile

on:
  schedule:
    # Раз в сутки в 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Выполняем официальный скрипт рендера напрямую через npx/node
      - name: Render Profile
        run: |
          npx --yes expressive-profile || node -e '
            // fallback run
          '
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      # Либо запускаем официальный экшен
      - name: Run Expressive Profile Action
        uses: metawka/expressive-profile@v1
        continue-on-error: true
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Cleanup watermark & maintain custom edits
        run: |
          # Вырезаем ссылку на Expressive Profile из README
          if [ -f README.md ]; then
            python3 -c "
          import re
          with open('README.md', 'r') as f:
              c = f.read()
          c = re.sub(r'<a href=\"https://metawka\.github\.io/expressive-profile[^\"]*\"><picture>.*?</picture></a>\n?', '', c, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(c)
          "
          fi
          # Удаляем файлы кредитов
          rm -f assets/credit-dark.svg assets/credit-light.svg

          # Делаем лейбл "Contributions last year"
          sed -i 's/Contributions this year/Contributions last year/g' assets/stats-dark.svg assets/stats-light.svg 2>/dev/null || true

      - name: Commit cleaned changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile
          git diff --cached --quiet || (git commit -m "update profile stats" && git push)
